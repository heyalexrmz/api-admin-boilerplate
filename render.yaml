services:
  - type: web
    name: taxo-timbre-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    # Existing production schema is managed with db:push; the migration journal is empty.
    preDeployCommand: pnpm db:push
    startCommand: NODE_ENV=production pnpm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: taxo-timbre-db
          property: internalConnectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DOCUMENT_SIGNING_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: UPSTREAM_API_KEY
        sync: false
      - key: UPSTREAM_WEBHOOK_HEADER
        value: typeform-signature
      - key: UPSTREAM_WEBHOOK_TOKEN
        sync: false
      - key: WEBHOOK_ROUTER_FORWARD_URLS
        value: '["https://timbre-nine.vercel.app/api/tocino/webhook-router"]'
      - key: UPSTREAM_WEBHOOK_SECRET
        sync: false
      - key: UPSTREAM_WEBHOOK_SECRET_PREVIOUS
        sync: false
      - key: UPSTREAM_ASSET_HOSTS
        sync: false

  - type: worker
    name: taxo-timbre-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: NODE_ENV=production pnpm exec tsx worker/index.ts
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: taxo-timbre-db
          property: internalConnectionString
      - key: DOCUMENT_SIGNING_SECRET
        fromService:
          name: taxo-timbre-web
          type: web
          envVarKey: DOCUMENT_SIGNING_SECRET
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: WORKER_POLL_INTERVAL_MS
        value: "2000"
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: UPSTREAM_BASE_URL
        sync: false
      - key: UPSTREAM_API_KEY
        sync: false
      - key: UPSTREAM_WEBHOOK_HEADER
        value: typeform-signature
      - key: UPSTREAM_WEBHOOK_TOKEN
        fromService:
          name: taxo-timbre-web
          type: web
          envVarKey: UPSTREAM_WEBHOOK_TOKEN
      - key: WEBHOOK_ROUTER_FORWARD_URLS
        fromService:
          name: taxo-timbre-web
          type: web
          envVarKey: WEBHOOK_ROUTER_FORWARD_URLS
      - key: UPSTREAM_WEBHOOK_SECRET
        sync: false
      - key: UPSTREAM_WEBHOOK_SECRET_PREVIOUS
        sync: false
      - key: UPSTREAM_ASSET_HOSTS
        sync: false

  # Public HTTP ingress; durable delivery processing runs in taxo-timbre-worker.
  - type: web
    name: taxo-timbre-webhook-router
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: NODE_ENV=production pnpm exec tsx worker/webhook-router.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: taxo-timbre-db
          property: internalConnectionString
      - key: UPSTREAM_WEBHOOK_HEADER
        value: typeform-signature
      - key: UPSTREAM_WEBHOOK_TOKEN
        fromService:
          name: taxo-timbre-web
          type: web
          envVarKey: UPSTREAM_WEBHOOK_TOKEN
      - key: WEBHOOK_ROUTER_FORWARD_URLS
        fromService:
          name: taxo-timbre-web
          type: web
          envVarKey: WEBHOOK_ROUTER_FORWARD_URLS

databases:
  - name: taxo-timbre-db
    plan: basic-256mb
    region: oregon
